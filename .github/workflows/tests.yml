name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  packaging:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m unittest discover -s tests -v
  patch-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ref: b5bffd3ec4db487e7e3dec59663875b0ef7b72ca
            profile: legacy
          - ref: 10382da79a2a2d6e8ae221fa63077215389c1ad2
            profile: 0.158.0-alpha.2
          - ref: 0d9c7cbfa6cf1489f55a8a9542b75ddd2c061807
            profile: desktop-26.924.2738.0
          - ref: 4ebc485ca321243727539187169425fcf972f2c4
            profile: desktop-26.1013.4894.0-sqlite-v2
          - ref: 5425d3e625daa58eea3ad1de27c087eb3b2ffbd3
            profile: desktop-26.1016.6573.0-sqlite-v2
          - ref: 680c4ba93ec79c292287fb9e0b627dc7a76e3b5e
            profile: desktop-26.1016.8120.0-sqlite-v2
            toolchain: '1.99.1'
          - ref: 51f97c6bca5500edbb986f6d9fe64fa2e63cbdd4
            profile: desktop-26.1016.8622.0-sqlite-v2
            toolchain: '1.99.1'
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with: {path: patch}
      - uses: actions/checkout@v4
        with:
          repository: openai/codex
          ref: ${{ matrix.ref }}
          path: upstream
      - uses: dtolnay/rust-toolchain@master
        with: {toolchain: "${{ matrix.toolchain || '1.95.0' }}"}
      - name: Apply pinned profile
        run: |
          if [ "${{ matrix.profile }}" = "legacy" ]; then
            bash ./patch/apply.sh ./upstream
          else
            python3 ./patch/build_backend.py --profile "${{ matrix.profile }}" --apply ./upstream
          fi
      - name: Match the current Windows source-build inputs
        if: matrix.profile == 'desktop-26.1016.6573.0-sqlite-v2' || matrix.profile == 'desktop-26.1016.8120.0-sqlite-v2' || matrix.profile == 'desktop-26.1016.8622.0-sqlite-v2'
        run: |
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'patch')
          import build_backend as build
          source = Path('upstream')
          folder, profile = build.load_profile('${{ matrix.profile }}')
          manifest = source / 'codex-rs/Cargo.toml'
          lock = source / 'codex-rs/Cargo.lock'
          text, locked = build.inject_workspace_version(manifest.read_text(), lock.read_text(), profile)
          manifest.write_text(text)
          lock.write_text(locked)
          build.qualify_migration_bytes(source, build.migration_rows(folder, profile), all_databases=True)
          PY
      - name: Test current compatibility module with locked dependencies
        if: matrix.profile == 'desktop-26.1016.6573.0-sqlite-v2' || matrix.profile == 'desktop-26.1016.8120.0-sqlite-v2' || matrix.profile == 'desktop-26.1016.8622.0-sqlite-v2'
        run: cargo test --locked --manifest-path upstream/codex-rs/Cargo.toml -p codex-core prompt_history_compat --lib -- --test-threads 1
      - name: Test retained profiles
        if: matrix.profile != 'desktop-26.1016.6573.0-sqlite-v2' && matrix.profile != 'desktop-26.1016.8120.0-sqlite-v2' && matrix.profile != 'desktop-26.1016.8622.0-sqlite-v2'
        run: cargo test --manifest-path upstream/codex-rs/Cargo.toml -p codex-core prompt_history_compat --lib -- --test-threads 1
