name: qualify-desktop-8622
on:
  push:
    branches: [qualify-desktop-26-1016-8622]
permissions:
  contents: read
jobs:
  exact-current-source:
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ad057a0ade9a99eb84161a23c8462ac0f68e8f1a
          path: patch
      - uses: actions/checkout@v4
        with:
          repository: openai/codex
          ref: 51f97c6bca5500edbb986f6d9fe64fa2e63cbdd4
          path: upstream
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify exact public build recipe
        run: |
          test "$(git -C patch rev-parse HEAD)" = ad057a0ade9a99eb84161a23c8462ac0f68e8f1a
          echo 'b230fa8e3902fcdc45b274f95c19ac78dfe29639ac11401dc6e1ec4d1e895bf1  patch/build_backend.py' | sha256sum --check
          echo '5097116c9d1b73f0586a2d75ff4e34120a22b2a1bde920d7ca76a457534d5aaf  patch/profiles/desktop-26.1016.8622.0-sqlite-v2/profile.json' | sha256sum --check
      - name: All repository packaging and retained-interface tests
        working-directory: patch
        run: python -m unittest discover -s tests -v
      - uses: dtolnay/rust-toolchain@master
        with: {toolchain: '1.99.1'}
      - name: Apply exact current profile and migration bytes
        run: |
          python3 patch/build_backend.py --profile desktop-26.1016.8622.0-sqlite-v2 --apply upstream
          python3 - <<'PYCODE'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'patch')
          import build_backend as build
          source = Path('upstream')
          folder, profile = build.load_profile('desktop-26.1016.8622.0-sqlite-v2')
          manifest = source / 'codex-rs/Cargo.toml'
          lock = source / 'codex-rs/Cargo.lock'
          text, locked = build.inject_workspace_version(manifest.read_text(), lock.read_text(), profile)
          manifest.write_text(text)
          lock.write_text(locked)
          build.qualify_migration_bytes(source, build.migration_rows(folder, profile), all_databases=True)
          PYCODE
      - name: Complete core compilation and all compatibility-module tests
        run: cargo test --locked --manifest-path upstream/codex-rs/Cargo.toml -p codex-core prompt_history_compat --lib -- --test-threads 1
